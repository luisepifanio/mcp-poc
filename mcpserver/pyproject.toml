[project]
name = "mcpserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "colorlog>=6.10.1",
    "fastapi-mcp>=0.4.0",
    "fastapi[standard]>=0.121.0",
    "fastcrud>=0.19.2",
    "faststream[redis]>=0.6.4",
    "pydantic-settings>=2.11.0",
    "python-json-logger>=4.0.0",
    "result",
    "scrapy-playwright>=0.0.44",
    "sqlalchemy[asyncio]>=2.0.44",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = [
    "async-asgi-testclient>=1.4.11",
    "httpx>=0.28.1",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.4",
]


[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic", "app/infrastructure/scrapy_spider"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]
line-length = 90

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true # Enable live logging to the console
log_cli_level = "INFO" # Set the console logging level to DEBUG
addopts = [
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",                           # Habilita la cobertura de ramas
    "--import-mode=importlib",
]

testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/functional",
] #Ajustamos los path de los tests.

# Agrega esta línea:
pythonpath = ["."]

filterwarnings = [
    "ignore:Can't validate argument 'sa_type'; can't locate any SQLAlchemy dialect named 'sa':sqlalchemy.exc.SAWarning",
    "ignore:The `__get_pydantic_core_schema__` method of the `BaseModel` class is deprecated.:DeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]

[tool.coverage.run]
branch = true
source = ["app"] # Ajusta el nombre del módulo

[tool.coverage.paths]
source = ["app"]

[tool.coverage.report]
show_missing = true
#fail_under = 90
skip_empty = true
exclude_lines = [
    ".*# pragma: no cover",
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
    'logger\..*',
    "pass",
]

[tool.coverage.html]
directory = "dist/reports/coverage/html"

[tool.coverage.xml]
output = "dist/reports/coverage/coverage.xml"

[tool.uv.sources]
result = { git = "https://github.com/montasaurus/result" }
